services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hypertrack
      POSTGRES_PASSWORD: hypertrack
      POSTGRES_DB: hypertrack
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypertrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://hypertrack:hypertrack@db:5432/hypertrack?schema=public"
      JWT_SECRET: "cambia-esto-por-un-secreto-largo-y-aleatorio"
      PORT: 4000
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:4000/api"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
