name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hypertrack
          POSTGRES_PASSWORD: hypertrack
          POSTGRES_DB: hypertrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hypertrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://hypertrack:hypertrack@localhost:5432/hypertrack_test?schema=public"
      JWT_SECRET: "ci-test-secret"
      CORS_ORIGIN: "http://localhost:5173"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Aplicar migraciones de Prisma
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Ejecutar pruebas
        working-directory: backend
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Compilar
        working-directory: frontend
        run: npm run build
